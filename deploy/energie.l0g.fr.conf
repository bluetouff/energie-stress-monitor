# energie.l0g.fr — vhost HTTP. Lancer certbot ENSUITE :
#   sudo certbot --apache -d energie.l0g.fr
# certbot génère lui-même le vhost :443 (energie.l0g.fr-le-ssl.conf) avec les
# certificats et la redirection HTTP->HTTPS.
#
# NE PAS ajouter ici de bloc <VirtualHost *:443> ni "SSLEngine on" sans
# certificat : Apache refuserait de démarrer (leçon de déploiement, cf README).
#
# Après certbot, ajouter HSTS au vhost SSL généré :
#   Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

<VirtualHost *:80>
    ServerName energie.l0g.fr
    DocumentRoot /var/www/html/energie

    <Directory /var/www/html/energie>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    # snapshot.json rafraîchi toutes les 30 min : cache court
    <FilesMatch "snapshot\.json$">
        Header set Cache-Control "no-cache, max-age=60"
    </FilesMatch>
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    # --- En-têtes de sécurité ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    # CSP stricte : self pour script/style (aucun inline), connect-src limité
    # aux deux flux live sans clé fetchés par le navigateur.
    Header always set Content-Security-Policy "default-src 'none'; \
script-src 'self'; \
style-src 'self'; \
img-src 'self' data:; \
connect-src 'self' https://api.frankfurter.dev https://api.carbonintensity.org.uk; \
base-uri 'none'; \
form-action 'none'; \
frame-ancestors 'none'"

    ErrorLog ${APACHE_LOG_DIR}/energie_error.log
    CustomLog ${APACHE_LOG_DIR}/energie_access.log combined
</VirtualHost>
